version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
      reviewed-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
      reviewed-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "major"
