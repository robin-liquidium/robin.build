[fmt]
ignorePatterns = ["src/routeTree.gen.ts"]

[lint]
typeAware = true
maxWarnings = 0
ignorePatterns = ["src/routeTree.gen.ts"]

[lint.rules]
# Off because they misread this UI: popover click guards and table rows whose
# cells hold their own labelled content.
"jsx-a11y/control-has-associated-label" = "off"
"jsx-a11y/no-noninteractive-element-interactions" = "off"
"jsx-a11y/alt-text" = "error"
"jsx-a11y/anchor-ambiguous-text" = "error"
"jsx-a11y/anchor-has-content" = "error"
"jsx-a11y/anchor-is-valid" = "error"
"jsx-a11y/aria-activedescendant-has-tabindex" = "error"
"jsx-a11y/aria-props" = "error"
"jsx-a11y/aria-proptypes" = "error"
"jsx-a11y/aria-role" = "error"
"jsx-a11y/aria-unsupported-elements" = "error"
"jsx-a11y/autocomplete-valid" = "error"
"jsx-a11y/heading-has-content" = "error"
"jsx-a11y/html-has-lang" = "error"
"jsx-a11y/iframe-has-title" = "error"
"jsx-a11y/img-redundant-alt" = "error"
"jsx-a11y/interactive-supports-focus" = "error"
"jsx-a11y/label-has-associated-control" = "error"
"jsx-a11y/lang" = "error"
"jsx-a11y/media-has-caption" = "error"
"jsx-a11y/mouse-events-have-key-events" = "error"
"jsx-a11y/no-access-key" = "error"
"jsx-a11y/no-aria-hidden-on-focusable" = "error"
"jsx-a11y/no-autofocus" = "error"
"jsx-a11y/no-distracting-elements" = "error"
"jsx-a11y/no-interactive-element-to-noninteractive-role" = "error"
"jsx-a11y/no-noninteractive-element-to-interactive-role" = "error"
"jsx-a11y/no-noninteractive-tabindex" = "error"
"jsx-a11y/no-redundant-roles" = "error"
"jsx-a11y/role-has-required-aria-props" = "error"
"jsx-a11y/role-supports-aria-props" = "error"
"jsx-a11y/scope" = "error"
"jsx-a11y/tabindex-no-positive" = "error"

# Module mocks and `expect(obj.method)` are normal in tests.
[[lint.overrides]]
files = ["tests/**"]
rules = { "@typescript-eslint/no-floating-promises" = "off", "@typescript-eslint/unbound-method" = "off" }

[test]
environment = "happy-dom"
preload = ["./tests/setup.ts"]
coverageThreshold = { lines = 1.0, functions = 1.0 }
coveragePathIgnorePatterns = [
  "components/custom/**",
  "components/magicui/animated-theme-toggler.tsx",
  "components/magicui/morphing-text.tsx",
  "components/magicui/terminal.tsx",
  "components/os/AppWindow.tsx",
  "components/os/Desktop.tsx",
  "components/os/StatusBar.tsx",
  "components/os/apps/BlogApp.tsx",
  "components/os/apps/BrowserApp.tsx",
  "components/os/apps/CalculatorApp.tsx",
  "components/os/apps/FilesApp.tsx",
  "components/os/apps/NotesApp.tsx",
  "components/os/apps/SnakeApp.tsx",
  "components/ui/dock.tsx",
  "components/ui/noise.tsx",
  "components/ui/sliding-number.tsx",
  "components/ui/tree-view.tsx",
  "src/features/home/**",
  "src/features/revolut-personal/CallbackClient.tsx",
  "src/routeTree.gen.ts",
  "src/routes/__root.tsx",
  "src/styles/**",
  "tests/**",
]
